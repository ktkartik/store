const {brand} = modules["config/brand.js"];
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',bag:'<path d="M4 8h16l1 13H3L4 8Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/>',heart:'<path d="M20.8 8.6c0 4.5-8.8 10-8.8 10s-8.8-5.5-8.8-10a4.7 4.7 0 0 1 8.8-2.1 4.7 4.7 0 0 1 8.8 2.1Z"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',leaf:'<path d="M20 3C8 3 3 9 6 16c7 3 13-2 14-13ZM4 21l12-12"/>',drop:'<path d="M12 3c3 5 7 8 7 12a7 7 0 1 1-14 0c0-4 4-7 7-12Z"/>',spark:'<path d="M12 2 9 9 2 12l7 3 3 7 3-7 7-3-7-3-3-7Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',left:'<path d="m15 5-7 7 7 7"/>',right:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.1"/>',facebook:'<path d="M14 21v-8h3l1-4h-4V7c0-1 1-2 2-2h2V2h-3c-4 0-5 3-5 5v2H7v4h3v8"/>',pinterest:'<circle cx="12" cy="12" r="9"/><path d="m9 20 3-13m-2 5c-2-2 0-6 3-6 4 0 4 7 0 8-2 0-2-2-2-2"/>'};

const img=(name,alt='',cls='',eager=false)=>`<img src="${ASSETS[name]||ASSETS.hero}" alt="${esc(alt)}" class="${cls}" ${eager?'fetchpriority="high"':'loading="lazy"'} decoding="async">`;
const btn=(label,href,cls='')=>`<a class="btn ${cls}" href="#/${href}">${label}</a>`;
const action=(label,act,id='',cls='')=>`<button type="button" class="btn ${cls}" data-action="${act}" data-id="${id}">${label}</button>`;
const iconBtn=(name,label,act,id='',cls='')=>`<button type="button" class="icon-btn ${cls}" aria-label="${esc(label)}" data-action="${act}" data-id="${id}">${icon(name)}</button>`;
const wordmark=()=>`<a href="#/" class="wordmark">${esc(brand.name)}<small>${esc(brand.tagline.toUpperCase())}</small></a>`;

const empty=(t,p,link='shop',label='Explore Collection')=>`<div class="empty"><h2>${t}</h2><p>${p}</p>${btn(label,link)}</div>`;

return {money,esc,icon,img,btn,action,iconBtn,wordmark,head,title,empty};
})();
modules["context/store.js"] = (()=>{
const {products} = modules["data/catalog.js"];
const {brand} = modules["config/brand.js"];
const key='aurevana-demo-v1';
const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};
const old=read()||{};
const state={cart:Array.isArray(old.cart)?old.cart.filter(x=>products.some(p=>p.id===x.id)&&Number.isInteger(x.qty)&&x.qty>0).map(x=>({...x,qty:Math.min(99,x.qty)})):[],wish:Array.isArray(old.wish)?old.wish.filter(id=>products.some(p=>p.id===id)):[],recent:Array.isArray(old.recent)?old.recent:[],coupon:old.coupon===brand.coupon?brand.coupon:'',overlay:null,filters:{q:'',category:'',ingredient:'',max:'2000',sort:'featured'},qty:1,photo:0,review:0,order:null};
const save=()=>{try{localStorage.setItem(key,JSON.stringify({cart:state.cart,wish:state.wish,recent:state.recent,coupon:state.coupon}))}catch{}};
const getProduct=id=>products.find(p=>p.id===id);
const totals=()=>{const subtotal=state.cart.reduce((n,x)=>n+getProduct(x.id).price*x.qty,0);const discount=state.coupon===brand.coupon?Math.round(subtotal*brand.discount):0;const shipping=subtotal===0||subtotal>=brand.shippingThreshold?0:brand.shippingFee;return {subtotal,discount,shipping,total:subtotal-discount+shipping,count:state.cart.reduce((n,x)=>n+x.qty,0)}};
const add=(id,qty=1)=>{if(!getProduct(id))return;let item=state.cart.find(x=>x.id===id);if(item)item.qty=Math.min(99,item.qty+qty);else state.cart.push({id,qty:Math.min(99,qty)});save()};
const quantity=(id,delta)=>{let item=state.cart.find(x=>x.id===id);if(item){item.qty=Math.min(99,item.qty+delta);if(item.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);save()}};
const toggleWish=id=>{if(!getProduct(id))return;state.wish=state.wish.includes(id)?state.wish.filter(x=>x!==id):[...state.wish,id];save()};

return {state,save,getProduct,totals,add,quantity,toggleWish};
})();

function overlay(){let o=state.overlay;if(!o)return '';let top=t=>`<div class="drawer-head"><h3>${t}</h3>${iconBtn('close','Close dialog','close')}</div>`;if(o.type==='cart')return `<div class="overlay" data-backdrop><aside class="drawer" role="dialog" aria-modal="true" aria-label="Shopping bag">${top('Your Bag')}${state.cart.length?cartItems()+summary()+`<div class="center">${btn('View Shopping Bag','cart','outline')}</div>`:empty('Your bag is empty.','Add a product to get started.')}</aside></div>`;if(o.type==='search')return `<div class="overlay modal" data-backdrop><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Search">${top('Discover Your Ritual')}<input type="search" id="search-overlay" placeholder="Search rosemary, amla, gift…" aria-label="Search products" value="${esc(o.q||'')}"><div id="search-results" style="margin-top:18px">${searchResults(o.q||'')}</div></div></div>`;if(o.type==='menu')return `<div class="overlay" data-backdrop><aside class="drawer" role="dialog" aria-modal="true" aria-label="Menu">${top(brand.name)}<div style="display:grid;gap:20px;font-size:18px">${navlinks()}<a href="#/wishlist">Wishlist</a><a href="#/login">Account</a></div></aside></div>`;if(o.type==='quick')return `<div class="overlay modal" data-backdrop><div class="modal-panel" role="dialog" aria-modal="true" aria-label="Quick view">${top('Quick View')}${detail(getProduct(o.id),true)}</div></div>`;return ''}


return {header,footer,card,home,newsletter,shop,shopResults,detail,cartItems,summary,cart,checkout,wishlist,order,about,ingredientPage,journal,contact,login,policy,notFound,searchResults,overlay,testimonial};
})();
modules["main.js"] = (()=>{
const {brand} = modules["config/brand.js"];
const {products,reviews} = modules["data/catalog.js"];
const {state,getProduct,totals,save,add,quantity,toggleWish} = modules["context/store.js"];
const pages = modules["pages/storefront.js"];
let root, main, header, footer, overlayRoot, toastRoot, timer, previousFocus, currentRoute='';
const route=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
const go=path=>{let h='#/'+path;if(location.hash===h){state.overlay=null;render();}else location.hash=h;};
const renderHeader=()=>{header.innerHTML=pages.header()};
const renderOverlay=()=>{let active=!!state.overlay;overlayRoot.innerHTML=pages.overlay();document.body.style.overflow=active?'hidden':'';if(!active&&previousFocus?.isConnected){previousFocus.focus();previousFocus=null}};
const toast=msg=>{toastRoot.innerHTML='';const node=document.createElement('div');node.className='toast';node.setAttribute('role','status');node.textContent=msg;toastRoot.append(node);clearTimeout(timer);timer=setTimeout(()=>node.remove(),3500)};
function renderPage(){let [p,id]=route();let html;switch(p){case undefined:html=pages.home();break;case 'shop':html=pages.shop();break;case 'product':html=pages.detail(getProduct(id));break;case 'about':html=pages.about();break;case 'ingredients':html=pages.ingredientPage();break;case 'journal':html=pages.journal(id);break;case 'contact':html=pages.contact();break;case 'cart':html=pages.cart();break;case 'checkout':html=pages.checkout();break;case 'wishlist':html=pages.wishlist();break;case 'order':html=pages.order();break;case 'login':html=pages.login();break;case 'faq':case 'privacy':case 'shipping':case 'returns':case 'terms':html=pages.policy(p);break;default:html=pages.notFound();}main.innerHTML=html;document.title=(p?((p==='product'&&getProduct(id)?.name)||p[0].toUpperCase()+p.slice(1))+' | ':'')+brand.name+' — Botanical Haircare Demo';}
function render(){renderHeader();renderPage();renderOverlay()}
function onRoute(){state.overlay=null;state.qty=1;state.photo=0;let [p,id]=route();if(p==='product'&&getProduct(id)){state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,6);save()}currentRoute=location.hash;render();window.scrollTo(0,0);}
function openOverlay(o){previousFocus=document.activeElement;state.overlay=o;renderOverlay();let target=o.type==='search'?document.getElementById('search-overlay'):overlayRoot.querySelector('button');target?.focus()}
function closeOverlay(){state.overlay=null;renderOverlay()}
function updateCart(){renderHeader();if(['cart','checkout'].includes(route()[0]))renderPage();renderOverlay()}
function changeDetail(){if(state.overlay?.type==='quick')renderOverlay();else renderPage()}
function onClick(e){const link=e.target.closest('a[href^="#/"]');if(link){if(link.hash===location.hash&&state.overlay)closeOverlay();return}if(e.target.hasAttribute('data-backdrop')){closeOverlay();return}const b=e.target.closest('[data-action]');if(!b)return;let {action:a,id,delta}=b.dataset;switch(a){case 'menu':case 'search':case 'cart':openOverlay({type:a});break;case 'close':closeOverlay();break;case 'login':case 'wishlist':go(a);break;case 'quick':state.qty=1;state.photo=0;openOverlay({type:'quick',id});break;case 'add':add(id);updateCart();toast('Added to your shopping bag.');break;case 'detail-add':add(id,state.qty);state.overlay={type:'cart'};updateCart();toast('Added to your shopping bag.');break;case 'buy':add(id,state.qty);go('checkout');break;case 'wish':{toggleWish(id);let on=state.wish.includes(id);renderHeader();if(state.overlay?.type==='quick'){renderPage();renderOverlay()}else renderPage();toast(on?'Saved to your wishlist.':'Removed from your wishlist.');break}case 'cart-qty':quantity(id,Number(delta));updateCart();break;case 'remove':state.cart=state.cart.filter(x=>x.id!==id);save();updateCart();toast('Item removed.');break;case 'clear-coupon':state.coupon='';save();updateCart();toast('Coupon removed.');break;case 'detail-qty':state.qty=Math.max(1,Math.min(99,state.qty+Number(delta)));changeDetail();break;case 'photo':state.photo=Number(id);changeDetail();break;case 'zoom':b.classList.toggle('zoom');break;case 'clear-filters':state.filters={q:'',category:'',ingredient:'',max:'2000',sort:'featured'};renderPage();break;case 'review':state.review=(state.review+Number(id)+reviews.length)%reviews.length;document.getElementById('testimonial').innerHTML=pages.testimonial();break;case 'fill-demo':{const f=b.closest('form');Object.entries({name:'Demo Customer',email:'demo@example.com',phone:'9999999999',pin:'110001',city:'New Delhi',state:'Delhi',address:'123 Sample Street'}).forEach(([k,v])=>f.elements[k].value=v);break}case 'social':toast('Social profile is a demo placeholder.');break;}}
function onInput(e){const el=e.target;if(el.dataset.filter){state.filters[el.dataset.filter]=el.value;const results=document.getElementById('shop-results');if(results)results.innerHTML=pages.shopResults()}if(el.id==='search-overlay'&&state.overlay){state.overlay.q=el.value;document.getElementById('search-results').innerHTML=pages.searchResults(el.value)}}
function onSubmit(e){const f=e.target;if(!f.dataset.form)return;e.preventDefault();if(!f.reportValidity())return;switch(f.dataset.form){case 'coupon':{let code=f.elements.coupon.value.trim().toUpperCase();if(code===brand.coupon){state.coupon=code;save();updateCart();toast('WELCOME10 applied — 10% demo discount.')}else toast('Invalid demo coupon. Try WELCOME10.');break}case 'checkout':if(!state.cart.length)return;state.order={id:'AUR-DEMO-'+Date.now().toString(36).toUpperCase(),total:totals().total};state.cart=[];state.coupon='';save();f.reset();go('order');break;case 'newsletter':f.reset();toast('Demo subscription successful. No email was sent.');break;case 'contact':f.reset();toast('Demo message submitted. No data was sent.');break;case 'login':f.reset();toast('Demo account preview successful. No credentials stored.');break}}
function onKey(e){if(e.key==='Escape'&&state.overlay){closeOverlay();return}if(e.key==='Enter'&&e.target.dataset.action==='zoom'){e.preventDefault();e.target.classList.toggle('zoom')}if(e.key==='Tab'&&state.overlay){const els=Array.from(overlayRoot.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex="0"]')).filter(x=>x.offsetParent!==null);if(!els.length)return;let first=els[0],last=els.at(-1);if(e.shiftKey&&(document.activeElement===first||!overlayRoot.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!overlayRoot.contains(document.activeElement))){e.preventDefault();first.focus()}}}
function mountStorefront(el){root=el;root.innerHTML='<div id="store-header"></div><main id="store-main" tabindex="-1"></main><div id="store-footer"></div><div id="store-overlay"></div><div id="store-toast" aria-live="polite"></div>';header=root.querySelector('#store-header');main=root.querySelector('#store-main');footer=root.querySelector('#store-footer');overlayRoot=root.querySelector('#store-overlay');toastRoot=root.querySelector('#store-toast');footer.innerHTML=pages.footer();root.addEventListener('click',onClick);root.addEventListener('input',onInput);root.addEventListener('change',onInput);root.addEventListener('submit',onSubmit);document.addEventListener('keydown',onKey);window.addEventListener('hashchange',onRoute);onRoute();return()=>{root.removeEventListener('click',onClick);root.removeEventListener('input',onInput);root.removeEventListener('change',onInput);root.removeEventListener('submit',onSubmit);document.removeEventListener('keydown',onKey);window.removeEventListener('hashchange',onRoute);clearTimeout(timer);document.body.style.overflow='';root.innerHTML=''}}

return {mountStorefront};
})();
modules["main.js"].mountStorefront(document.getElementById("app"));</script></body></html>
